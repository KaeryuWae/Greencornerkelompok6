<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="GreenCorner - Kebun mini bunga Asoka dan Aster karya siswa kelas X-TE 3 SMK Negeri 2 Purwokerto.">
  <title>GreenCorner - Kebun Mini Asoka &amp; Aster</title>

  <!-- Google Fonts: Baloo 2 & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Lewati ke konten utama</a>

  <!-- Header Khusus Indeks: Merek dan Tombol Tema Saja -->
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="GreenCorner Beranda">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"/>
        </svg>
        <span>GreenCorner</span>
      </a>

      <div class="header-actions">
        <button type="button" class="theme-toggle" aria-label="Beralih ke mode gelap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content" class="hero-cover">
    <!-- Siluet Daun Latar Belakang -->
    <svg class="cover-bg-leaf-1" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M10,90 Q30,10 90,10 Q90,70 10,90 Z" />
    </svg>
    <svg class="cover-bg-leaf-2" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M10,90 Q70,90 90,10 Q30,10 10,90 Z" />
    </svg>

    <div class="container">
      <div class="cover-grid">
        <!-- Kolom Kiri: Teks -->
        <div class="cover-content">
          <div class="cover-meta">
            <span>SMK Negeri 2 Purwokerto</span>
            <span aria-hidden="true">•</span>
            <span>Kelas X-TE 3</span>
          </div>

          <h1 class="cover-title">GreenCorner</h1>

          <p class="cover-subtitle">Kebun mini bunga Asoka dan Aster, kami tanam dan rawat bersama.</p>

          <div class="cover-btn-wrap">
            <a href="home.html" class="btn btn-primary" style="font-size: 1.1rem; padding: 0.85rem 2.25rem;">
              <span>Masuk ke website</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </a>
          </div>
        </div>

        <!-- Kolom Kanan: Foto Sampul Bingkai Daun -->
        <div class="cover-photo-wrapper">
          <div class="leaf-frame">
            <img src="assets/img/hasil-jauh.jpg" width="1100" height="825" alt="Bedeng GreenCorner dengan deretan tanaman di sepanjang dinding">
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
